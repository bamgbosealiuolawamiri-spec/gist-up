services:
  - type: web
    runtime: static
    name: gist-up
    repo: https://github.com/bamgbosealiuolawamiri-spec/gist-up
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gist-up-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
